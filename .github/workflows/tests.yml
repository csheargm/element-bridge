name: tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read            # pull requests from forks get read-only access and no secrets
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
